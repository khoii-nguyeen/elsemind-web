<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Endless Visual</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #000;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

      // ─── Scene Setup ──────────────────────────────────────────────────────────

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x000000, 0.035);

      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        200
      );
      camera.position.z = 30;

      // ─── Post Processing ──────────────────────────────────────────────────────

      const composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));

      const bloom = new UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        1.4,  // strength
        0.4,  // radius
        0.1   // threshold
      );
      composer.addPass(bloom);

      // ─── Geometry Factory ─────────────────────────────────────────────────────

      const geometries = [
        () => new THREE.IcosahedronGeometry(1, 0),
        () => new THREE.OctahedronGeometry(1, 0),
        () => new THREE.TetrahedronGeometry(1, 0),
        () => new THREE.TorusGeometry(0.8, 0.25, 8, 24),
        () => new THREE.TorusKnotGeometry(0.7, 0.2, 64, 8),
        () => new THREE.DodecahedronGeometry(1, 0),
        () => new THREE.ConeGeometry(0.7, 1.5, 5),
        () => new THREE.BoxGeometry(1, 1, 1),
      ];

      function rand(min, max) {
        return Math.random() * (max - min) + min;
      }

      function createObject() {
        const geoFn = geometries[Math.floor(Math.random() * geometries.length)];
        const geometry = geoFn();
        const scale = rand(0.3, 2.8);

        // Wireframe or solid — mix it up
        const useWire = Math.random() > 0.45;
        const material = new THREE.MeshStandardMaterial({
          color: new THREE.Color().setHSL(Math.random(), 0.8, 0.6),
          emissive: new THREE.Color().setHSL(Math.random(), 1.0, 0.3),
          emissiveIntensity: rand(0.5, 1.5),
          wireframe: useWire,
          transparent: true,
          opacity: rand(0.4, 1.0),
          roughness: 0.4,
          metalness: 0.6,
        });

        const mesh = new THREE.Mesh(geometry, material);

        // Scatter in a sphere volume
        const theta = rand(0, Math.PI * 2);
        const phi = Math.acos(rand(-1, 1));
        const radius = rand(5, 50);
        mesh.position.set(
          radius * Math.sin(phi) * Math.cos(theta),
          radius * Math.sin(phi) * Math.sin(theta),
          rand(-60, 20)
        );

        mesh.scale.setScalar(scale);
        mesh.rotation.set(rand(0, Math.PI), rand(0, Math.PI), rand(0, Math.PI));

        // Per-object animation params
        mesh.userData = {
          rotAxis: new THREE.Vector3(
            rand(-1, 1),
            rand(-1, 1),
            rand(-1, 1)
          ).normalize(),
          rotSpeed: rand(0.001, 0.008),
          driftX: rand(-0.008, 0.008),
          driftY: rand(-0.008, 0.008),
          driftZ: rand(0.01, 0.05),   // drift toward camera
          hueOffset: Math.random(),
          hueSpeed: rand(0.0002, 0.001),
          baseOpacity: material.opacity,
          pulseSpeed: rand(0.005, 0.02),
          pulsePhase: rand(0, Math.PI * 2),
        };

        return mesh;
      }

      // ─── Populate Scene ───────────────────────────────────────────────────────

      const OBJECT_COUNT = 120;
      const objects = [];

      for (let i = 0; i < OBJECT_COUNT; i++) {
        const obj = createObject();
        scene.add(obj);
        objects.push(obj);
      }

      // ─── Ambient + Point Lights ───────────────────────────────────────────────

      scene.add(new THREE.AmbientLight(0xffffff, 0.3));

      const light1 = new THREE.PointLight(0x6688ff, 3, 60);
      light1.position.set(10, 10, 10);
      scene.add(light1);

      const light2 = new THREE.PointLight(0xff44aa, 3, 60);
      light2.position.set(-10, -10, 5);
      scene.add(light2);

      // ─── Camera slow drift ────────────────────────────────────────────────────

      const camDrift = {
        x: 0,
        y: 0,
        targetX: rand(-3, 3),
        targetY: rand(-3, 3),
        speed: 0.002,
      };

      // ─── Animate ──────────────────────────────────────────────────────────────

      const clock = new THREE.Clock();

      function resetObject(obj) {
        // Respawn far back so it drifts toward camera again
        const theta = rand(0, Math.PI * 2);
        const r = rand(5, 40);
        obj.position.set(
          r * Math.cos(theta),
          r * Math.sin(theta),
          rand(-80, -50)
        );
        // Fresh hue
        const h = Math.random();
        obj.material.color.setHSL(h, 0.8, 0.6);
        obj.material.emissive.setHSL(h, 1.0, 0.3);
      }

      function animate() {
        requestAnimationFrame(animate);

        const t = clock.getElapsedTime();

        // Slow light color cycling
        light1.color.setHSL((t * 0.04) % 1, 1, 0.6);
        light2.color.setHSL((t * 0.04 + 0.5) % 1, 1, 0.6);

        // Camera gentle sway
        camDrift.x += (camDrift.targetX - camDrift.x) * camDrift.speed;
        camDrift.y += (camDrift.targetY - camDrift.y) * camDrift.speed;
        if (Math.abs(camDrift.x - camDrift.targetX) < 0.01) {
          camDrift.targetX = rand(-5, 5);
          camDrift.targetY = rand(-5, 5);
        }
        camera.position.x = camDrift.x;
        camera.position.y = camDrift.y;
        camera.lookAt(0, 0, 0);

        // Update each object
        for (const obj of objects) {
          const ud = obj.userData;

          // Rotate around its own axis
          obj.rotateOnAxis(ud.rotAxis, ud.rotSpeed);

          // Drift through space
          obj.position.x += ud.driftX;
          obj.position.y += ud.driftY;
          obj.position.z += ud.driftZ;

          // Hue shift over time
          const hue = (ud.hueOffset + t * ud.hueSpeed) % 1;
          obj.material.color.setHSL(hue, 0.85, 0.65);
          obj.material.emissive.setHSL(hue, 1.0, 0.25);

          // Opacity pulse
          obj.material.opacity =
            ud.baseOpacity *
            (0.7 + 0.3 * Math.sin(t * ud.pulseSpeed * 60 + ud.pulsePhase));

          // Recycle when past camera
          if (obj.position.z > camera.position.z + 10) {
            resetObject(obj);
          }
        }

        composer.render();
      }

      animate();

      // ─── Resize ───────────────────────────────────────────────────────────────

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
